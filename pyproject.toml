[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-digest"
version = "0.3.0"
description = "100% local, privacy-preserving CLI for long-form .m4a transcription, speaker diarization, and acoustic/prosodic analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "faster-whisper>=1.0.3",
    "whisperx>=3.1.5",
    "pyannote.audio>=3.1.1",
    "huggingface-hub>=0.23.0",
    "transformers>=4.41.0",
]

[project.optional-dependencies]
prosody = [
    "opensmile>=2.5.0",
    "librosa>=0.10.2",
    "scipy>=1.13.0",
    "speechbrain>=1.0.0",
]
sherpa = [
    "sherpa-onnx>=1.10.0",
]
mlx = [
    "mlx-whisper>=0.4.0",
    "mlx-lm>=0.20.0",
    "parakeet-mlx>=0.3.0",
    "sherpa-onnx>=1.10.0",
]
dev = [
    "pytest>=8.0.0",
]
all = [
    "opensmile>=2.5.0",
    "librosa>=0.10.2",
    "scipy>=1.13.0",
    "speechbrain>=1.0.0",
    "sherpa-onnx>=1.10.0",
    "mlx-whisper>=0.4.0",
    "mlx-lm>=0.20.0",
    "parakeet-mlx>=0.3.0",
    "pytest>=8.0.0",
]

[project.scripts]
voice-digest = "voice_digest.cli:main"

[tool.setuptools.packages.find]
include = ["voice_digest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
